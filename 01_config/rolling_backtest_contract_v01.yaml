version: rolling_backtest_contract_v01
status: BACKTEST_ONLY
primary_grain: base_sku_x_branch_x_month
target: target_actual_gross_m2
horizons:
- 1
- 2
- 3
lineage:
  required_dataset_version: dataset_v012
  required_pair_feature_version: pair_feature_v013
  required_feature_selection_version: feature_selection_v04
  required_model_candidate_version: pair_modeling_v02
  required_model_candidate_status: PASS
origin_window:
  start: '2025-01-01'
  end: '2025-12-01'
  frequency: MS
  frozen_test_start: '2026-04-01'
  require_all_targets_before_frozen_test: true
  min_origins: 12
feature_parity:
  required: true
  origin: '2025-12-01'
  compare_selected_features_only: true
  numeric_rtol: 1.0e-09
  numeric_atol: 1.0e-09
calibration:
  target_months: 3
  current_active_only: true
  min_fit_rows_per_horizon: 5000
  min_calibration_rows_per_horizon: 250
  rule: At rolling origin O, FIT uses target_month < first calibration target month;
    CALIBRATION uses the last 3 target months ending at O; EVALUATION uses only forecast_origin=O
    and target months O+1..O+3. Evaluation labels are never used for model fitting,
    early stopping, hurdle threshold selection, or expert gate selection. After stopping
    iteration / threshold / gate are selected, LightGBM and Hurdle component models
    are refit on FIT + CALIBRATION before forecasting EVALUATION.
behavior:
  adi_threshold: 1.32
  cv2_threshold: 0.49
  very_sparse_max_positive_count: 1
  min_segment_calibration_rows: 100
  regular_experts:
  - lightgbm_tweedie
  - hurdle
  - moving_average_3
  - naive_1
  - seasonal_naive_12
  intermittent_experts:
  - hurdle
  - lightgbm_tweedie
  - moving_average_3
  - croston_sba
  - tsb
  - naive_1
  very_sparse_experts:
  - hurdle
  - croston_sba
  - tsb
  - naive_1
  - lightgbm_tweedie
model_policy:
  train_catboost: false
  reason_catboost_excluded: Model V0.2 corrected CatBoost numerics but validation
    quality remained materially worse than LightGBM; rolling V0.1 spends compute on
    LightGBM + Hurdle + baselines.
  lightgbm_hyperparameters_source: model_contract_v02.yaml
  hurdle_hyperparameters_source: model_contract_v02.yaml
  gpu_policy_source: model_contract_v02.yaml
metrics:
  monthly:
  - wape
  - mae
  - bias
  - bias_ratio
  - zero_false_positive_rate
  - positive_wape
  horizons:
  - H1
  - H2
  - H3
  cumulative_3m:
    require_complete_h1_h2_h3: true
    levels:
    - PAIR
    - BASE_SKU
    - BRANCH
    - PORTFOLIO
    report:
    - wape_3m
    - mae_3m
    - bias_3m
    - bias_ratio_3m
  revision:
    transitions:
    - H2_TO_H1
    - H3_TO_H2
    levels:
    - PAIR
    - BASE_SKU
  stability:
  - mean_origin_wape
  - median_origin_wape
  - std_origin_wape
  - mean_abs_bias_ratio
  - max_abs_bias_ratio
  - underforecast_origin_rate
  - origin_wins
safety:
  supabase_select_only: true
  supabase_write_allowed: false
  current_status_as_predictor_allowed: false
  frozen_test_allowed: false
  reconciliation_allowed: false
  model_freeze_allowed: false
  production_publish_allowed: false
